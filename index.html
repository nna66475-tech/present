<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神経衰弱ウェブゲーム</title>
    <!-- Google Fonts for 8-bit style typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SVG Definitions for Rabbit Mask Transition -->
    <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
        <defs>
            <clipPath id="rabbit-clip" clipPathUnits="objectBoundingBox">
                <!-- A normalized 0-1 path for a pixelated rabbit head -->
                <path d="M0.3 0 h0.1 v0.2 h-0.1 z M0.6 0 h0.1 v0.2 h-0.1 z M0.2 0.2 h0.3 v0.2 h-0.3 z M0.5 0.2 h0.3 v0.2 h-0.3 z M0.1 0.4 h0.8 v0.2 h-0.8 z M0.1 0.6 h0.8 v0.2 h-0.8 z M0.2 0.8 h0.6 v0.1 h-0.6 z M0.3 0.9 h0.4 v0.1 h-0.4 z" />
            </clipPath>
        </defs>
    </svg>

    <!-- Transition Overlay layer -->
    <div id="transition-overlay">
        <div id="transition-mask"></div>
    </div>

    <!-- Main Game Container -->
    <div class="game-container">

        <!-- １：Title Screen -->
        <div id="title-screen" class="screen active">
            <img src="logo.PNG" alt="神経衰弱" class="logo-img">
            <div class="click-to-start">画面をクリックしてスタート</div>
        </div>

        <!-- ２：Character Select Screen -->
        <div id="select-screen" class="screen">
            <div class="screen-title">キャラクター選択</div>
            <div class="char-layout">
                <!-- Icons generated dynamically or hardcoded here -->
                <div class="char-row">
                    <div class="char-card" data-char="anzu">
                        <div class="char-icon-wrapper"><img src="icon_anzu.PNG" alt="美影杏" class="char-icon"></div>
                        <div class="char-name">美影杏</div>
                    </div>
                    <div class="char-card" data-char="ohasi">
                        <div class="char-icon-wrapper"><img src="icon_ohasi.PNG" alt="大橋理沙" class="char-icon"></div>
                        <div class="char-name">大橋理沙</div>
                    </div>
                    <div class="char-card" data-char="erina">
                        <div class="char-icon-wrapper"><img src="icon_erina.PNG" alt="吉良えりな" class="char-icon"></div>
                        <div class="char-name">吉良えりな</div>
                    </div>
                </div>
                <div class="char-row">
                    <div class="char-card" data-char="numao">
                        <div class="char-icon-wrapper"><img src="icom_numao.PNG" alt="沼尾正" class="char-icon"></div>
                        <div class="char-name">沼尾正</div>
                    </div>
                    <div class="char-card" data-char="yuki">
                        <div class="char-icon-wrapper"><img src="icon_yuki.PNG" alt="宝木雪" class="char-icon"></div>
                        <div class="char-name">宝木雪</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ４：Pre-match Screen -->
        <div id="pre-match-screen" class="screen">
            <img src="" alt="対戦前" class="tiki-img" id="tiki-gif">
            <button class="retro-btn" id="start-match-btn">対戦する</button>
        </div>

        <!-- ５：Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div id="turn-display" class="turn-indicator player-turn">あなたのターン</div>
                <div>あなた: <span id="player-score">0</span> | <span id="cpu-name-display">CPU</span>: <span id="cpu-score">0</span></div>
            </div>
            <div class="board-container">
                <div class="grid-board" id="board"></div>
            </div>
        </div>

        <!-- ７＆８：Result Screen -->
        <div id="result-screen" class="screen">
            <img src="" alt="勝敗アニメ" class="result-img-box" id="result-gif">
            <img src="" alt="勝敗文字" class="result-text-img" id="result-moji">
            <div class="result-buttons">
                <button class="retro-btn" id="retry-btn">もう一度対戦</button>
                <button class="retro-btn" id="home-btn">ホームに戻る</button>
            </div>
        </div>

    </div>

    <!-- Audio Elements -->
    <audio id="bgm" src="maou_bgm_8bit26.mp3" loop></audio>
    <audio id="se-select" src="se_select_008.wav"></audio>
    <audio id="se-clear" src="jingle_original_clear_001.wav"></audio>
    <audio id="se-die" src="jingle_original_die_002.wav"></audio>

    <script src="main.js"></script>
</body>
</html>
